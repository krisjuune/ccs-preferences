# Paths to raw survey data files, relative to the project root
raw_data:
  ch: raw_data/ccs_conjoint_CH_240225_1004.csv  # Switzerland
  cn: raw_data/ccs_conjoint_CN_240225_1752.csv  # China

# Set to false to skip the basic choice model and run only the HCM
run_basic_model: false

# Attribute coding for the hybrid choice model
# "sum_to_zero": all levels included, each beta = deviation from attribute mean
# "reference_level": baseline level dropped, each beta = deviation from baseline
coding: "reference_level"

# MCMC sampling settings — used by both choice models
mcmc:
  seed: 42
  draws: 1000
  tune: 500
  chains: 4
  cores: 4

# Plot visual settings — shared across all visualisation scripts
plots:
  base_size: 14
  dpi: 300
  ci_width: 0.9
  point_size: 4
  point_alpha: 0.9
  slab_alpha: 0.6
  slab_alpha_framing: 0.3
  sp_source_light: "#e7d7e3" 
  attr_colours:
    attr_engagement:     "#4e79a7"
    attr_vicinity:       "#f28e2b"
    attr_industry:       "#e15759"
    attr_costs:          "#76b7b2"
    attr_reason:         "#59a14f"
    attr_source_purpose: "#b07aa1"
