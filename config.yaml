# Paths to raw survey data files, relative to the project root
raw_data:
  ch: raw_data/ccs_conjoint_CH_240225_1004.csv  # Switzerland
  cn: raw_data/ccs_conjoint_CN_240225_1752.csv  # China

# Set to false to skip the basic choice model (no latent traits)
run_basic_model: false

# Set to false to skip the base hybrid choice model (HCM without the
# interaction term). Optional — kept only for comparison against
# main_hybrid_choice_model, which the repo's main plots use and always runs.
run_base_model: false

# Set to true to also run the full pairwise interaction model (all
# attribute-level interactions, no three-way with country). Off by default —
# long runtime.
run_full_interaction_model: false

# Set to true to also run main_choice_model_no_values (identical to
# main_hybrid_choice_model but without value moderation / the SEM
# measurement model). Off by default — used only for the H4 cross-model
# country-effect comparison, not the repo's main plots.
run_no_values_model: false

# Attribute coding for the base hybrid choice model and basic choice model
# (main_hybrid_choice_model always uses reference_level — see its docstring)
# "sum_to_zero": all levels included, each beta = deviation from attribute mean
# "reference_level": baseline level dropped, each beta = deviation from baseline
coding: "reference_level"

# MCMC sampling settings — shared by all choice models
mcmc:
  seed: 42
  draws: 1000
  tune: 500
  chains: 4
  cores: 4

# Plot visual settings — shared across all visualisation scripts
plots:
  base_size: 14       # main text size for all figures
  fig_width: 10        # standard width (inches) for single-panel figures
  fig_width_wide: 14   # standard width (inches) for faceted/multi-panel figures
  dpi: 300
  ci_width: 0.89
  point_size: 4
  point_alpha: 0.9
  slab_alpha: 0.6
  slab_alpha_framing: 0.3
  sp_source_light: "#e7d7e3"
  # main six-colour scheme: one colour per conjoint attribute
  attr_colours:
    attr_engagement:     "#4e79a7"
    attr_vicinity:       "#f28e2b"
    attr_industry:       "#e15759"
    attr_costs:          "#76b7b2"
    attr_reason:         "#59a14f"
    attr_source_purpose: "#b07aa1"
  # three-colour scheme: one colour per latent value dimension
  value_colours:
    lreco:      "#4e79a7"
    galtan:     "#f28e2b"
    socio_ecol: "#59a14f"
  # two-colour scheme: diverging gradient (e.g. theta heatmap)
  diverging_colours:
    low:     "#b07aa1"
    mid:     "white"
    high:    "#59a14f"
    # neutral grey for three-category low/neutral/high plots (e.g.
    # extractive/neutral/inclusive design bundles) — "mid" above is a
    # gradient midpoint (white), not a visible category swatch
    neutral: "#8c8c8c"
